name: BrewLite CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend - NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Start seeded PostgreSQL for integration tests
        run: docker compose -f ../../docker-compose.yml up -d --wait db
      - name: API end-to-end test (menu to paid order confirmation)
        run: npm run test:e2e -- --runInBand
        env:
          DATABASE_URL: postgresql://postgres:brewlite_dev@localhost:5433/brewlite_db
          JWT_SECRET: local-e2e-only-secret
      - name: Stop test database
        if: always()
        run: docker compose -f ../../docker-compose.yml down -v --remove-orphans

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  publish-images:
    name: Build and push Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/brewlite-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/brewlite-web:${{ github.sha }}

  deploy-render:
    name: Deploy images to Render
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      api_deploy_id: ${{ steps.deploy_api.outputs.deploy_id }}
      web_deploy_id: ${{ steps.deploy_web.outputs.deploy_id }}
    steps:
      - name: Deploy API image
        id: deploy_api
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          IMAGE_URL: ghcr.io/lydinhchi123-code/brewlite-api:${{ github.sha }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK}")"
          echo "$response"
          deploy_id="$(jq -r '.deploy.id // empty' <<< "$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "Render did not return an API deploy ID." >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Deploy web image
        id: deploy_web
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          IMAGE_URL: ghcr.io/lydinhchi123-code/brewlite-web:${{ github.sha }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "${RENDER_DEPLOY_HOOK}")"
          echo "$response"
          deploy_id="$(jq -r '.deploy.id // empty' <<< "$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "Render did not return a web deploy ID." >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Wait for deploy and smoke test
    needs: deploy-render
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for API and web deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          API_DEPLOY_ID: ${{ needs.deploy-render.outputs.api_deploy_id }}
          WEB_DEPLOY_ID: ${{ needs.deploy-render.outputs.web_deploy_id }}
        run: |
          wait_for_deploy() {
            local service_id="$1"
            local deploy_id="$2"
            local name="$3"

            for attempt in $(seq 1 60); do
              response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" \
                "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}")"
              status="$(jq -r '.status' <<< "$response")"
              echo "${name} deploy status: ${status}"

              if [[ "$status" == "live" ]]; then
                return 0
              fi

              case "$status" in
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "${name} deploy failed: ${status}" >&2
                  return 1
                  ;;
              esac

              sleep 10
            done

            echo "Timed out waiting for ${name} deploy." >&2
            return 1
          }

          wait_for_deploy "$API_SERVICE_ID" "$API_DEPLOY_ID" "API"
          wait_for_deploy "$WEB_SERVICE_ID" "$WEB_DEPLOY_ID" "Web"

      - name: Smoke test API health
        run: curl --fail-with-body --silent --show-error https://brewlite-api-tutb.onrender.com/health

      - name: Smoke test web
        run: curl --fail --silent --show-error --output /dev/null https://brewlite-web-ksd1.onrender.com/
