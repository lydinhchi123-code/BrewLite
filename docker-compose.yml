services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brewlite_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev} # Local container only; never reuse in production.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - brewlite_pgdata:/var/lib/postgresql
      - ./database:/database:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00-brewlite-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-brewlite_dev}@db:5432/brewlite_db
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret-change-me}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  brewlite_pgdata:
