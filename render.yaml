databases:
  - name: brewlite-db
    databaseName: brewlite
    user: brewlite
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: brewlite-api
    runtime: image
    image:
      url: ghcr.io/lydinhchi123-code/brewlite-api:a692489942b88efaed3a46503e9764db365a99e2
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brewlite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://brewlite-web-ksd1.onrender.com

  - type: web
    name: brewlite-web
    runtime: image
    image:
      url: ghcr.io/lydinhchi123-code/brewlite-web:a692489942b88efaed3a46503e9764db365a99e2
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://brewlite-api-tutb.onrender.com
